services:
  postgres:
    image: postgres:16
    container_name: sankhya_tool_db
    restart: always
    environment:
      POSTGRES_DB: sankhya_tool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3131
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  pied-interactive:
    build: .
    container_name: pied_interactive
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:3131@postgres:5432/sankhya_tool
      SANKHYA_SERVICE_URL: http://host.docker.internal:3030
      # força DNS preferir IPv4 — Docker network sem IPv6, login.microsoftonline.com
      # resolve só pra AAAA (IPv6) e dava ENETUNREACH no fetch do Graph
      NODE_OPTIONS: --dns-result-order=ipv4first

volumes:
  postgres_data:
